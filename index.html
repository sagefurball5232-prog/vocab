<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>英语单词复习</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

    margin: 0;
    color: #111827;
  }
  .stats {

  }

  /* Home screen */

  .pending-channel {
    margin: 16px auto 0;

    align-items: center;
    padding: 14px 18px;

    display: inline-block;
    background: #eef4ff;
    color: #2563eb;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

    background: #f9fafb;
    border-radius: 14px;
    padding: 40px 24px 28px;
    text-align: center;
    border: 1px solid #eef0f3;
    position: relative;
  }
  .btn-back {
    position: absolute;
    top: 12px;
    left: 12px;
    background: #fff;
    border: 1px solid #e5e7eb;
    color: #4b5563;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-back:hover {
    background: #f3f4f6;
    border-color: #d1d5db;
    color: #111827;
  }
  .word {
    font-size: 44px;
    font-weight: 700;
    color: #111827;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .speak-btn {
    background: #eef4ff;
    color: #2563eb;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .speak-btn:hover { background: #dbeafe; }
  .phonetic {
    font-size: 20px;
    color: #6b7280;
    margin-top: 12px;
    font-family: "Lucida Sans Unicode", "DejaVu Sans", serif;
  }
  .hint-box {
    margin-top: 24px;
    padding: 14px 16px;
    background: #fff7ed;
    color: #9a3412;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.6;
    text-align: left;
    border: 1px solid #fed7aa;
  }

    padding: 14px 16px;

    color: #065f46;
    border-radius: 10px;
    font-size: 16px;
    line-height: 1.6;
    text-align: left;
    border: 1px solid #a7f3d0;
  }

    display: flex;
    gap: 10px;
    margin-top: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    transition: transform .05s, background .15s, box-shadow .15s;

  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-hint { background: #fef3c7; color: #92400e; }
  .btn-hint:hover { background: #fde68a; }
  .btn-dont-know { background: #fee2e2; color: #991b1b; }
  .btn-dont-know:hover { background: #fecaca; }
  .btn-know { background: #d1fae5; color: #065f46; }
  .btn-know:hover { background: #a7f3d0; }
  .btn-next { background: #2563eb; color: #fff; }
  .btn-next:hover { background: #1d4ed8; }
  .btn-ghost { background: #f3f4f6; color: #374151; }

  .done h2 { margin: 10px 0; }
  .done p { color: #6b7280; }

  /* Manage modal */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(17,24,39,0.5);

    align-items: center;
    justify-content: center;
    padding: 20px;

  .modal {
    background: #fff;
    width: 100%;

    max-height: 86vh;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;

  .modal header {
    padding: 16px 20px;
    border-bottom: 1px solid #eef0f3;
  }
  .modal .body { padding: 16px 20px; overflow-y: auto; }
  .modal .footer {
    padding: 12px 20px;
    border-top: 1px solid #eef0f3;

    justify-content: flex-end;

  }
  textarea {
    width: 100%;
    min-height: 240px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    resize: vertical;
  }
  .hint-tip { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
  .word-list { font-size: 13px; color: #4b5563; }
  .word-list-item {
    padding: 6px 0;
    border-bottom: 1px dashed #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;

    display: inline-block;
    background: #fef3c7;
    color: #92400e;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 onclick="renderHome()" style="cursor:pointer;" title="返回主菜单">📖 英语单词复习</h1>
    <div class="stats" id="stats" style="display:none;">
      <span>剩余：<b id="remaining">0</b></span>
      <span>已掌握：<b id="known">0</b></span>
      <span>待复习：<b id="pending">0</b></span>
    </div>
  </header>
  <main id="main"></main>
</div>

<!-- 单词管理弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <header><h1 style="font-size:16px;">管理单词表</h1></header>
    <div class="body">
      <div class="hint-tip">
        每行一个单词，格式：<code>word | 音标 | 词性. 中文意思 | 例句（可选，用 ___ 代表单词位置）</code><br>
        例如：<code>apple | /ˈæpəl/ | n. 苹果 | I eat an ___ every day.</code><br>
        音标、例句可省略；多个释义可写在一栏。
      </div>
      <textarea id="wordInput" spellcheck="false"></textarea>
      <div style="margin-top:10px;">
        <button class="btn-ghost" onclick="loadSample()">载入示例单词</button>
        <button class="btn-ghost" onclick="exportWords()">导出当前</button>
      </div>
    </div>
    <div class="footer">
      <button class="btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveWords()">保存</button>
    </div>
  </div>
</div>

/* 单词所属 Week 映射（来自 Semester 2 Vocabulary List）。一个单词可属于多个 Week */

};
function getUnitsOf(wordLower) {
  const r = [];
  for (const wk in WEEK_DATA) {
    if (WEEK_DATA[wk].includes(wordLower)) r.push(wk);
  }
  return r;
}

let words = [];      // 全部单词
let queue = [];      // 未复习队列（索引）
let knownCount = 0;
let pendingSet = new Set();   // 标记为待复习的index（当前轮）
let savedPending = new Set(); // 跨会话持久化的待复习单词（按 word 字符串）
let currentIdx = null;
let hintUsed = false;
let currentMode = 'all';      // 'all' / 'pending' / 'Week 1' ...

/* ============ 持久化 ============ */
function saveState() {
  try {
    localStorage.setItem('vocab_words_s2_ex', JSON.stringify(words));
  } catch(e){}
}
function loadState() {
  try {
    const s = localStorage.getItem('vocab_words_s2_ex');
    if (s) words = JSON.parse(s);
  } catch(e){}
}
function savePending() {
  try {
    localStorage.setItem('vocab_pending_s2', JSON.stringify([...savedPending]));
  } catch(e){}
}
function loadPending() {
  try {
    const s = localStorage.getItem('vocab_pending_s2');
    if (s) savedPending = new Set(JSON.parse(s));
  } catch(e){}
}
function markPending(idx) {
  pendingSet.add(idx);
  savedPending.add(words[idx].word);
  savePending();
}
function unmarkPending(idx) {
  pendingSet.delete(idx);
  savedPending.delete(words[idx].word);
  savePending();
}

/* ============ 解析 ============ */
function parseWords(text) {
  const arr = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const parts = line.split('|').map(s => s.trim());
    if (!parts[0]) return;
    const w = parts[0];
    arr.push({
      word: w,
      phonetic: parts[1] || '',
      meaning: parts[2] || '',
      example: parts[3] || '',
      units: getUnitsOf(w.toLowerCase())
    });
  });
  return arr;
}
function wordsToText(arr) {
  return arr.map(w => [w.word, w.phonetic, w.meaning, w.example].join(' | ')).join('\n');
}
function getFilteredIndices(mode) {
  if (mode === 'all') return words.map((_, i) => i);
  if (mode === 'pending') {
    return words.map((_, i) => i).filter(i => savedPending.has(words[i].word));
  }
  // Week N
  return words.map((_, i) => i).filter(i => words[i].units && words[i].units.includes(mode));
}

/* ============ UI 渲染 ============ */
const main = document.getElementById('main');
const statsEl = document.getElementById('stats');

function renderHome() {
  statsEl.style.display = 'none';
  const count = words.length;
  const pendingCount = savedPending.size;
  const weeks = Object.keys(WEEK_DATA);
  const weekCards = weeks.map(wk => {
    const n = getFilteredIndices(wk).length;
    return `<button class="unit-card" onclick="startReview('${wk}')">
      <div class="unit-name">${wk}</div>
      <div class="unit-count">${n} 词</div>
    </button>`;
  }).join('');

  main.innerHTML = `
    <div class="home">
      <div style="font-size:48px;">📚</div>
      <h2 style="margin:8px 0 0;">选择复习范围</h2>
      <p>单词库共 <b>${count}</b> 个单词</p>

      ${pendingCount > 0 ? `
        <div class="pending-channel" onclick="startReview('pending')">
          <div style="font-size:28px;">🔁</div>
          <div style="flex:1;text-align:left;margin-left:14px;">
            <div style="font-weight:600;color:#92400e;">复习"待复习"单词</div>
            <div style="font-size:13px;color:#9a3412;">你曾点过 hint 或不会的 <b>${pendingCount}</b> 个单词</div>
          </div>
          <div style="color:#92400e;font-size:20px;">→</div>
        </div>
      ` : ''}

      <div class="actions" style="margin:18px 0 6px;">
        <button class="btn-primary" onclick="startReview('all')" ${count===0?'disabled style="opacity:.5;cursor:not-allowed;"':''}>📖 复习全部单词</button>
        <button class="btn-ghost" onclick="openModal()">管理单词表</button>
        ${pendingCount > 0 ? '<button class="btn-ghost" onclick="clearPending()">清空待复习</button>' : ''}
      </div>

      <div class="unit-grid">${weekCards}</div>
    </div>
  `;
}

function clearPending() {
  if (!confirm('确定清空所有"待复习"标记吗？')) return;
  savedPending = new Set();
  savePending();
  renderHome();
}

function updateStats() {
  document.getElementById('remaining').textContent = queue.length;
  document.getElementById('known').textContent = knownCount;
  document.getElementById('pending').textContent = savedPending.size;
}

function renderCard() {
  if (queue.length === 0) {
    renderDone();
    return;
  }
  statsEl.style.display = 'flex';
  currentIdx = queue[0];
  const w = words[currentIdx];
  hintUsed = false;
  const isPending = savedPending.has(w.word);
  const unitsLabel = (w.units && w.units.length) ? w.units.join(' · ') : '';

  main.innerHTML = `
    <div class="card">
      <button class="btn-back" onclick="renderHome()" title="返回主菜单">← 主菜单</button>
      ${unitsLabel ? `<div class="unit-label">${unitsLabel}</div>` : ''}
      <div class="word">
        <span>${escapeHtml(w.word)}</span>
        <button class="speak-btn" onclick="speak('${escapeJs(w.word)}')" title="朗读">🔊</button>
        ${isPending ? '<span class="pending-badge">待复习</span>' : ''}
      </div>
      <div class="phonetic">${escapeHtml(w.phonetic || '')}</div>
      <div id="extra"></div>
      <div class="controls" id="controls">
        <button class="btn-know" onclick="markKnown()">✓ 认识</button>
        <button class="btn-hint" onclick="showHint()">💡 hint</button>
        <button class="btn-dont-know" onclick="showAnswer()">✗ 不会</button>
      </div>
    </div>
  `;
  updateStats();
}

function showHint() {
  const w = words[currentIdx];
  hintUsed = true;
  markPending(currentIdx);
  // 把当前移到队尾
  queue.shift();
  queue.push(currentIdx);

  const extra = document.getElementById('extra');
  let hintHtml;
  if (w.example) {
    const re = new RegExp('\\b' + escapeReg(w.word) + '[a-zA-Z]*\\b', 'gi');
    let sentence = w.example;
    if (!sentence.includes('___')) {
      sentence = sentence.replace(re, '_____');
    }
    hintHtml = `<div class="hint-box">📌 例句提示：${escapeHtml(sentence)}</div>`;
  } else {
    hintHtml = `<div class="hint-box">📌 首字母：<b>${w.word[0]}</b> · 共 ${w.word.length} 个字母</div>`;
  }
  extra.innerHTML = hintHtml;

  document.getElementById('controls').innerHTML = `
    <button class="btn-dont-know" onclick="showAnswer()">✗ 还是不会，看答案</button>
    <button class="btn-next" onclick="nextCard()">下一个 →</button>
  `;
  updateStats();
}

function showAnswer() {
  const w = words[currentIdx];
  markPending(currentIdx);
  if (!hintUsed) {
    queue.shift();
    queue.push(currentIdx);
  }
  const extra = document.getElementById('extra');
  extra.innerHTML = `
    <div class="meaning-box">
      📖 ${escapeHtml(w.meaning || '(暂无释义)')}
      ${w.example ? `<div style="margin-top:6px;color:#047857;font-size:14px;">例：${escapeHtml(w.example)}</div>` : ''}
    </div>
  `;
  document.getElementById('controls').innerHTML = `
    <button class="btn-next" onclick="nextCard()">下一个 →</button>
  `;
  updateStats();
}

function markKnown() {
  const w = words[currentIdx];
  const extra = document.getElementById('extra');
  extra.innerHTML = `
    <div class="meaning-box">
      📖 ${escapeHtml(w.meaning || '(暂无释义)')}
      ${w.example ? `<div style="margin-top:6px;color:#047857;font-size:14px;">例：${escapeHtml(w.example)}</div>` : ''}
    </div>
  `;
  document.getElementById('controls').innerHTML = `
    <button class="btn-next" onclick="confirmKnown()">下一个 →</button>
    <button class="btn-dont-know" onclick="markWrong()">😅 记错了</button>
  `;
  updateStats();
}

function confirmKnown() {
  queue.shift();
  if (pendingSet.has(currentIdx)) {
    unmarkPending(currentIdx);
  }
  knownCount++;
  renderCard();
}

function markWrong() {
  markPending(currentIdx);
  queue.shift();
  queue.push(currentIdx);
  renderCard();
}

function nextCard() {
  renderCard();
}

function renderDone() {
  statsEl.style.display = 'flex';
  const modeLabel = currentMode === 'all' ? '全部' : (currentMode === 'pending' ? '待复习' : currentMode);
  const celebrateSvg = `
    <img src="celebrate.png" alt="celebrate" style="display:block;margin:0 auto;max-width:220px;height:auto;"/>
  `;

  main.innerHTML = `
    <div class="done">
      ${celebrateSvg}
      <h2 style="margin:8px 0;">🎉 恭喜完成本轮复习！</h2>
      <p>范围：<b>${modeLabel}</b>  ·  本轮掌握 <b>${knownCount}</b> 个  ·  待复习剩余 <b>${savedPending.size}</b> 个</p>
      <div class="controls">
        <button class="btn-primary" onclick="startReview(currentMode)">再来一轮</button>
        ${savedPending.size > 0 && currentMode !== 'pending' ? '<button class="btn-hint" onclick="startReview(\'pending\')">🔁 攻克待复习</button>' : ''}
        <button class="btn-ghost" onclick="renderHome()">返回首页</button>
      </div>
    </div>
  `;
  updateStats();
}

/* ============ 流程 ============ */
function startReview(mode) {
  mode = mode || 'all';
  currentMode = mode;
  const idxs = getFilteredIndices(mode);
  if (idxs.length === 0) {
    alert('该范围内没有单词');
    return;
  }
  queue = idxs.slice();
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  knownCount = 0;
  // 当前轮的pendingSet仅用于显示徽章，savedPending做持久化
  pendingSet = new Set(queue.filter(i => savedPending.has(words[i].word)));
  renderCard();
}

/* ============ 朗读 ============ */
function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('当前浏览器不支持语音朗读');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

/* ============ 弹窗 ============ */
function openModal() {
  document.getElementById('wordInput').value = wordsToText(words);
  document.getElementById('modalMask').classList.add('open');
}
function closeModal() {
  document.getElementById('modalMask').classList.remove('open');
}
function saveWords() {
  const text = document.getElementById('wordInput').value;
  words = parseWords(text);
  saveState();
  closeModal();
  renderHome();
}
function loadSample() {
  document.getElementById('wordInput').value = SAMPLE;
}
function exportWords() {
  const blob = new Blob([wordsToText(words)], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vocab.txt';
  a.click();
}

/* ============ 工具 ============ */
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeJs(s){return String(s).replace(/['\\]/g,'\\$&');}
function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

/* ============ 启动 ============ */
loadState();
loadPending();
// 如果旧数据没有 units 字段，重建
const needsRebuild = words.length === 0 || !words[0].units;
if (needsRebuild) {
  words = parseWords(SAMPLE);
  saveState();
}
renderHome();
</script>
